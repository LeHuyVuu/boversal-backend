services:
  gateway:
    build:
      context: .
      dockerfile: Boversal.Gateway/Dockerfile
    container_name: boversal-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - projectmanagement
      - utility
      - intellcoreservice
      - authenticate-service
    restart: unless-stopped
    networks:
      - boversal-network

  intellcoreservice:
    build:
      context: ./IntelliCoreService
      dockerfile: Dockerfile
    container_name: boversal-intellcoreservice
    environment:
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AIVEN_DB_URL=${AIVEN_DB_URL}
    restart: unless-stopped
    networks:
      - boversal-network

  projectmanagement:
    build:
      context: ./ProjectManagementService
      dockerfile: ProjectManagementService.API/Dockerfile
    container_name: boversal-projectmanagement
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DATABASE_URL=${DATABASE_URL}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
    restart: unless-stopped
    networks:
      - boversal-network

  utility:
    build:
      context: ./UtilityService
      dockerfile: Dockerfile
    container_name: boversal-utility
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
    restart: unless-stopped
    networks:
      - boversal-network

  authenticate-service:
    build:
      context: ./AuthenticateService
      dockerfile: Dockerfile
    container_name: boversal-authenticate-service
    environment:
      - SERVER_PORT=8080
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
    restart: unless-stopped
    networks:
      - boversal-network

networks:
  boversal-network:
    driver: bridge
