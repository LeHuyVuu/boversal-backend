name: Build & Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Build and deploy all services'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 336036263554.dkr.ecr.ap-southeast-1.amazonaws.com/boversal-backend

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      project-management: ${{ steps.filter.outputs.project-management }}
      utility: ${{ steps.filter.outputs.utility }}
      intelli-core: ${{ steps.filter.outputs.intelli-core }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'Boversal.Gateway/**'
            project-management:
              - 'ProjectManagementService/**'
              - 'ProjectManagementService.API/**'
              - 'ProjectManagementService.Application/**'
              - 'ProjectManagementService.Domain/**'
              - 'ProjectManagementService.Infrastructure/**'
            utility:
              - 'UtilityService/**'
            intelli-core:
              - 'IntelliCoreService/**'

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    needs: changes
    if: (github.event_name == 'workflow_dispatch' && inputs.force_deploy) || needs.changes.outputs.gateway == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load AWS credentials
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          echo "AWS_ACCESS_KEY_ID=$(grep '^AWS_ACCESS_KEY_ID=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(grep '^AWS_SECRET_ACCESS_KEY=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Get image tag
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Boversal.Gateway/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}:gateway-${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}:gateway-latest

  project-management:
    name: Project Management
    runs-on: ubuntu-latest
    needs: changes
    if: (github.event_name == 'workflow_dispatch' && inputs.force_deploy) || needs.changes.outputs.project-management == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load AWS credentials
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          echo "AWS_ACCESS_KEY_ID=$(grep '^AWS_ACCESS_KEY_ID=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(grep '^AWS_SECRET_ACCESS_KEY=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Get image tag
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ProjectManagementService.API/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}:project-management-${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}:project-management-latest

  utility:
    name: Utility
    runs-on: ubuntu-latest
    needs: changes
    if: (github.event_name == 'workflow_dispatch' && inputs.force_deploy) || needs.changes.outputs.utility == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load AWS credentials
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          echo "AWS_ACCESS_KEY_ID=$(grep '^AWS_ACCESS_KEY_ID=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(grep '^AWS_SECRET_ACCESS_KEY=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Get image tag
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./UtilityService
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}:utility-${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}:utility-latest

  intelli-core:
    name: IntelliCore Service
    runs-on: ubuntu-latest
    needs: changes
    if: (github.event_name == 'workflow_dispatch' && inputs.force_deploy) || needs.changes.outputs.intelli-core == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load AWS credentials
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          echo "AWS_ACCESS_KEY_ID=$(grep '^AWS_ACCESS_KEY_ID=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(grep '^AWS_SECRET_ACCESS_KEY=' .env | cut -d'=' -f2- | tr -d '"')" >> "$GITHUB_ENV"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Get image tag
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./IntelliCoreService
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}:intellcoreservice-${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}:intellcoreservice-latest
